<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#05070f">
  <meta name="description" content="NEON BREAKER - a neon-soaked arcade breakout with procedurally generated levels, power-ups and combos.">
  <title>NEON BREAKER</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript>
    <p class="noscript">NEON BREAKER needs JavaScript to run.</p>
  </noscript>
  <main class="shell">
    <div class="frame">
      <canvas id="game" width="960" height="640" aria-label="Neon Breaker game field"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="glass" aria-hidden="true"></div>
    </div>
      <div class="touchbar">
        <button id="btnPause" type="button" tabindex="-1" aria-label="Pause game">II</button>
        <button id="btnMute" type="button" tabindex="-1" aria-label="Toggle sound" aria-pressed="false">M</button>
      </div>
    <p class="hint">
      <span class="for-desktop">Mouse / A&nbsp;D / Arrows to move &nbsp;·&nbsp; Space to serve &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</span>
      <span class="for-touch">Drag to move &nbsp;·&nbsp; Tap to serve <span class="rotate-note">&nbsp;·&nbsp; Rotate for a bigger field</span></span>
    </p>
  </main>

  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
